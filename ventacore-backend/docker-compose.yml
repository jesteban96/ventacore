version: '3.8'
services:
  db:
    image: postgres:15
    container_name: ventacore_db
    restart: always
    environment:
      POSTGRES_DB: ventacore
      POSTGRES_USER: devopssolutions
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
